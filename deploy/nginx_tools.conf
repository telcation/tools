# telcation.f5.si の server { listen 443 ssl; ... } ブロックの中に追記します
# （以前の /nisshi/ の location は削除し、この内容に置き換えます）

location = /tools {
    return 301 /tools/;
}

location /tools/ {
    # 末尾の / により、/tools/ を外してから 5012 番へ転送します
    proxy_pass http://127.0.0.1:5012/;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    # アプリが /tools/... のリンクを作るために使います
    proxy_set_header X-Forwarded-Prefix /tools;
    # チャイムの素材（音声・画像）のアップロード用
    client_max_body_size 32m;
}

# 以前のURL（/nisshi/）から新しいURLへ転送
location = /nisshi/chime       { return 301 /tools/chime/; }
location = /nisshi/admin       { return 301 /tools/admin; }
location = /nisshi/admin-chime { return 301 /tools/chime/admin; }
location /nisshi/       { return 301 /tools/nisshi/; }
location = /nisshi      { return 301 /tools/nisshi/; }
